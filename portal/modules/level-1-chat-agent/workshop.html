<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="샘플을 보며 MVP 제작부터 수정, 검증, 배포 판단까지 경험하는 AI 에이전트 워크숍">
  <title>LEVEL 1 | 에이전트 제작 워크숍</title>
  <link rel="stylesheet" href="./workshop-v3.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <a href="./index.html">← 인트로</a>
        <div>
          <span id="audienceChip" class="audience-chip">대상</span>
          <h1>에이전트 제작 워크숍</h1>
        </div>
      </div>
      <div class="top-actions">
        <span id="saveStatus" class="save" role="status">저장 준비</span>
        <button id="reset" class="btn ghost small" type="button">기록 초기화</button>
      </div>
    </div>
  </header>

  <div class="progress-wrap"><nav id="progress" class="progress" aria-label="제작 단계"></nav></div>

  <main class="shell">
    <header class="stage-title">
      <div><p id="stageHint">왼쪽의 작동 예시를 보고 오른쪽에서 내 버전을 만듭니다.</p><h2 id="stageName"></h2></div>
      <span id="stageCount" class="stage-count">1 / 4</span>
    </header>

    <div class="board">
      <aside class="sample" aria-label="작동 예시">
        <div class="sample-top"><span class="panel-label sample-label">SAMPLE</span><span class="live-dot">● LIVE PREVIEW</span></div>
        <h3 id="sampleTitle">작동하는 결과부터 봅니다</h3>
        <p id="sampleLead" class="sample-summary"></p>

        <section class="product-shell">
          <div class="product-bar"><span></span><span></span><span></span><strong id="productName">Mini Agent</strong></div>
          <div id="demoBox" class="demo"></div>
        </section>

        <section id="sampleStage" class="sample-stage"></section>

        <details class="reference">
          <summary>참고 설명 보기</summary>
          <div id="referenceBody" class="reference-body"></div>
        </details>
      </aside>

      <section class="follow" aria-label="따라하기">
        <div class="follow-top"><span class="panel-label follow-label">FOLLOW</span><strong>오른쪽만 작성하세요</strong></div>

        <section class="task-block task-web">
          <div class="task-head"><strong>① 웹페이지에서 할 일</strong><span class="task-tag">WEB</span></div>
          <p id="webHelp" class="task-help"></p>
          <div id="webForm"></div>
        </section>

        <section class="task-block task-ai">
          <div class="task-head"><strong>② 생성형 AI에서 할 일</strong><span class="task-tag">AI</span></div>
          <p id="aiHelp" class="task-help"></p>
          <pre id="aiPrompt" class="prompt"></pre>
          <div class="copy-row"><button id="copyAI" class="btn small" type="button">AI에 보낼 내용 복사</button></div>
        </section>

        <section class="checkpoint">
          <div><span>CHECK</span><strong id="checkTitle">다음 단계로 가기 전</strong></div>
          <p id="finishState">확인할 내용이 있습니다.</p>
        </section>

        <div class="nav"><button id="prev" class="btn secondary" type="button">이전</button><button id="next" class="btn" type="button">다음 단계</button></div>
      </section>
    </div>
  </main>

  <script src="./data.js"></script>
  <script src="./workshop-v3.js"></script>
</body>
</html>
